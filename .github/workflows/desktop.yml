name: Windows desktop CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Format backend
        run: cargo fmt --manifest-path backend/Cargo.toml --check

      - name: Format desktop host
        run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --check

      - name: Lint backend
        run: cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets

      - name: Test backend
        run: cargo test --locked --manifest-path backend/Cargo.toml

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: frontend
          tauriScript: cargo tauri
          args: --bundles nsis --target x86_64-pc-windows-msvc

      - name: Upload pull request installer
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: auto-coc-windows-x64-nsis
          path: frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
